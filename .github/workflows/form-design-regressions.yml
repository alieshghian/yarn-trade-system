name: Form design regression gate

on:
  push:
    branches: ['review/**', 'master']
  pull_request:
    branches: ['master']
  schedule:
    - cron: '15 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# net8.0 test hosts must run on an 8.0 patch even on multi-SDK runners.
env:
  DOTNET_ROLL_FORWARD: LatestPatch

concurrency:
  group: form-design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start isolated development fixture server
        run: |
          mkdir -p ../review-artifacts
          npm run dev -- --host 127.1.0.1 --strictPort > /tmp/yarn-form-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.1.0.1:5173/tests/form-designer.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/yarn-form-vite.log
          exit 1
      - name: Behavioral tests, TypeScript and real browser geometry
        run: |
          export FORM_TEST_BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$FORM_TEST_BROWSER" || { echo 'A real browser is required; tests cannot skip.'; exit 1; }
          npm run validate:form-designer
  theme-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Theme permissions, immutable revisions and shared Title list protections
        run: node frontend/tools/approved-form-gate.mjs theme-security
  operational:
    name: Approved form workflows (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [brands-operational, approved-yarns, product-group-operational, person-brand-lookup, warehouses]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise operational form in a disposable browser
        run: |
          export FORM_TEST_BROWSER="$(command -v google-chrome)"
          test -n "$FORM_TEST_BROWSER"
          npm run test:approved -- ${{ matrix.scenario }}
  production-navigation:
    runs-on: ubuntu-latest
    needs: [presentation, theme-security, operational, integration]
    if: always()
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Require every prerequisite to complete successfully
        working-directory: .
        env:
          PRESENTATION: ${{ needs.presentation.result }}
          THEME_SECURITY: ${{ needs['theme-security'].result }}
          OPERATIONAL: ${{ needs.operational.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          for status in "$PRESENTATION" "$THEME_SECURITY" "$OPERATIONAL" "$INTEGRATION"; do
            if [ "$status" != success ]; then
              echo "::error::A required suite ended with status '$status'; production acceptance requires success."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require protected references, unit evidence and production browser coverage
        env:
          APPROVAL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          export FORM_TEST_BROWSER="$(command -v google-chrome)"
          test -n "$FORM_TEST_BROWSER"
          npm run test:approved -- production
      - name: Prove the approved gate rejects controlled regressions
        run: |
          export FORM_TEST_BROWSER="$(command -v google-chrome)"
          test -n "$FORM_TEST_BROWSER"
          npm run test:approved:faults
      - name: Archive fault-detection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-form-fault-detection
          path: frontend/test-results/fault-injection
          if-no-files-found: ignore
      - name: Upload Persons visual mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: persons-visual-diff
          path: frontend/test-results/persons-visual
          if-no-files-found: ignore
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Start disposable SQL Server on loopback
        run: |
          password="Gt!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --name approved-form-sql -p 127.0.0.1::1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-latest
          port=$(docker port approved-form-sql 1433/tcp | cut -d: -f2)
          export SQLCMDPASSWORD="$password"
          for attempt in $(seq 1 60); do
            if docker exec -e SQLCMDPASSWORD approved-form-sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "YARN_TRADE_SQL_TEST_CONNECTION=Server=127.0.0.1,$port;Database=master;User Id=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run integration suite against disposable databases
        run: node frontend/tools/approved-form-gate.mjs integration
